name: Vérification des flux du seed

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1' # chaque lundi

jobs:
  feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:feeds
