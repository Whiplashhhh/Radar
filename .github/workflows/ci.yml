name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · typecheck · tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            dist
            web/dist
          retention-days: 3

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright
          path: |
            playwright-report
            docs/screenshots
          retention-days: 7

  docker:
    name: Image Docker + healthcheck
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: radar:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: docker compose up + healthcheck
        run: |
          mkdir -p data
          docker compose up -d --no-build
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' radar)
            echo "health: $status"
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          curl -fsS http://127.0.0.1:8787/health
          docker compose logs --tail 50
          test "$(docker inspect -f '{{.State.Health.Status}}' radar)" = "healthy"
          # le port ne doit être publié que sur 127.0.0.1
          docker port radar
          ! docker port radar | grep -Eq '0\.0\.0\.0|\[::\]'
