services:
  radar:
    build: .
    image: radar:latest
    container_name: radar
    restart: unless-stopped
    init: true
    # N'écoute QUE sur la boucle locale de l'hôte : l'accès passe par `tailscale serve` (HTTPS).
    ports:
      - "127.0.0.1:${PORT:-8787}:${PORT:-8787}"
    environment:
      PORT: ${PORT:-8787}
      TZ: Europe/Paris
      LOG_LEVEL: ${LOG_LEVEL:-info}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:radar@localhost}
      NVD_API_KEY: ${NVD_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Ollama sur l'hôte : http://host.docker.internal:11434 (voir README)
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      ALLOW_PRIVATE_NETWORKS: ${ALLOW_PRIVATE_NETWORKS:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||8787)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
